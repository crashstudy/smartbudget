<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SmartBudget</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #error-msg { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="loginAdmin()">Login</button>
        <p id="error-msg"></p>
    </div>

    <script>
        // YAHAN APNI SUPABASE URL AUR ANON KEY DAALO
        const supabaseUrl = 'YOUR_SUPABASE_URL_HERE';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY_HERE';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function loginAdmin() {
            const email = document.getElementById('email').val(); // user ki jagah value aayega line neeche thik likhi hai
            const emailValue = document.getElementById('email').value;
            const passwordValue = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.innerText = "Checking...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailValue,
                password: passwordValue,
            });

            if (error) {
                errorMsg.innerText = error.message;
            } else {
                errorMsg.style.color = "green";
                errorMsg.innerText = "Login Success! Redirecting...";
                // Login hone ke baad direct admin page par bhej dega
                window.location.href = "/admin"; 
            }
        }
    </script>
</body>
</html>
