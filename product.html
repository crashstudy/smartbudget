<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | SmartBudget Store</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .product-detail-section {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }
        .product-image-container {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .product-image-container img {
            width: 100%;
            border-radius: 12px;
            max-height: 450px;
            object-fit: contain;
        }

        /* Breadcrumb */
        .breadcrumb {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .breadcrumb a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .breadcrumb a:hover { text-decoration: underline; }

        .product-info h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
            line-height: 1.3;
            font-weight: 800;
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            gap: 5px;
        }

        /* Dynamic Stock Banner */
        .urgency-banner {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #dc2626;
        }

        .price-block {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .price-main { font-size: 2.8rem; font-weight: 800; color: var(--primary); }
        .price-mrp  { font-size: 1.2rem; text-decoration: line-through; color: #94a3b8; font-weight: 600; }
        .price-discount {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
        }

        /* Trust Badges Grid */
        .trust-badges {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }
        .trust-badge {
            background: #fff;
            border: 1px solid var(--border);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .trust-badge span.icon { font-size: 1.8rem; }
        .trust-badge span.text { font-size: 0.75rem; font-weight: 700; color: #475569; }

        /* CTA Button */
        .checkout-btn {
            font-size: 1.2rem;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            display: block;
            width: 100%;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .checkout-btn:hover:not(.disabled-btn) {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(59, 130, 246, 0.5);
        }
        .disabled-btn {
            background: #cbd5e1 !important;
            color: #94a3b8 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        /* Details Box */
        .details-box {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .details-box h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }
        .details-box p { color: #475569; line-height: 1.8; font-size: 1.05rem; }

        /* Specs List */
        .specs-list { list-style: none; padding: 0; }
        .specs-list li {
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            gap: 15px;
        }
        .specs-list li:last-child { border-bottom: none; }
        .specs-list li strong { min-width: 130px; color: var(--primary); font-weight: 700; }

        /* Mobile Sticky Buy Bar */
        .mobile-sticky-buy { display: none; }

        @media (max-width: 768px) {
            .product-detail-section {
                grid-template-columns: 1fr;
                gap: 30px;
                margin: 20px auto;
                padding-bottom: 90px;
            }
            .product-image-container { position: static; }
            .checkout-btn  { display: none; }
            .mobile-sticky-buy {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: white;
                padding: 12px 20px;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
                z-index: 1000;
                align-items: center;
                justify-content: space-between;
                border-top: 1px solid #e2e8f0;
            }
            .mobile-sticky-buy .price { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
            .mobile-sticky-buy .btn {
                padding: 14px 35px;
                font-size: 1.1rem;
                background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
                border-radius: 50px;
                color: white;
                font-weight: 800;
                text-decoration: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="logo.jpg" alt="Logo" class="nav-logo">
                <span class="brand-text">SmartBudget<span class="brand-dot">.in</span></span>
            </a>
            <nav class="nav-links">
                <a href="store.html" style="color: var(--accent); font-weight: 800;">← Back to Store</a>
            </nav>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="index.html">Home</a> &rsaquo;
        <a href="store.html">Store</a> &rsaquo;
        <span id="breadcrumb-name" style="color:#1e293b;">Loading...</span>
    </div>

    <main>
        <!-- Loading Screen -->
        <div id="loading-screen" style="text-align:center; padding:100px 20px; font-size:1.5rem; font-weight:bold; color:var(--accent);">
            ⏳ Fetching product details...
        </div>

        <!-- Main Product Layout (hidden until loaded) -->
        <div class="product-detail-section" id="main-product-layout" style="display:none;">

            <!-- Left: Product Image -->
            <div class="product-image-container">
                <img id="prod-img" src="" alt="Product Image">
            </div>

            <!-- Right: Product Info -->
            <div class="product-info">
                <div class="rating-badge">⭐ 4.8 &nbsp;|&nbsp; 2,104 Ratings</div>
                <h1 id="prod-name">...</h1>

                <!-- Dynamic Stock / Urgency Banner -->
                <div class="urgency-banner" id="prod-stock-banner"></div>

                <!-- Price Block -->
                <div class="price-block">
                    <span class="price-main">₹<span id="prod-price">0</span></span>
                    <span class="price-mrp">₹<span id="prod-mrp">0</span></span>
                    <span class="price-discount" id="prod-discount">0% OFF</span>
                </div>

                <!-- Dynamic Trust Badges -->
                <div class="trust-badges" id="dynamic-badges-grid">
                    <!-- Always-present defaults -->
                    <div class="trust-badge"><span class="icon">🛡️</span><span class="text">Secure Pay</span></div>
                    <div class="trust-badge"><span class="icon">🔄</span><span class="text">7 Days Return</span></div>
                </div>

                <!-- Desktop CTA -->
                <a href="#" id="buy-btn-desktop" class="checkout-btn">Proceed to Buy ⚡</a>

                <!-- Description & Specs -->
                <div class="details-box">
                    <h3>📝 Product Description</h3>
                    <p id="prod-desc">Loading...</p>

                    <h3 style="margin-top:30px;">⚙️ Specifications</h3>
                    <ul class="specs-list" id="prod-specs"></ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Sticky Buy Bar (hidden until loaded) -->
    <div class="mobile-sticky-buy" id="mobile-footer-bar" style="display:none;">
        <div style="display:flex; flex-direction:column;">
            <span style="font-size:0.78rem; text-decoration:line-through; color:#94a3b8;">
                MRP: ₹<span id="sticky-mrp">0</span>
            </span>
            <span class="price">₹<span id="sticky-price">0</span></span>
        </div>
        <a href="#" id="buy-btn-mobile" class="btn">Buy Now ⚡</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            // ============================================================
            //  SUPABASE CONFIG
            // ============================================================
            const SUPABASE_URL = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
            const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            // ============================================================
            //  GET PRODUCT ID FROM URL
            // ============================================================
            const urlParams = new URLSearchParams(window.location.search);
            const prodId    = urlParams.get('id');

            if (!prodId) {
                window.location.href = 'store.html';
                return;
            }

            const loadingScreen = document.getElementById('loading-screen');

            try {
                // ============================================================
                //  FETCH PRODUCT FROM SUPABASE
                // ============================================================
                const { data: products, error } = await db
                    .from('products')
                    .select('*')
                    .eq('product_id', prodId);

                if (error || !products || products.length === 0) {
                    loadingScreen.innerHTML = `
                        <div style="color:#ef4444;">
                            ❌ Product not found in store registry!<br>
                            <a href="store.html" style="color:var(--accent);font-size:1rem;margin-top:20px;display:inline-block;">
                                ← Back to Store
                            </a>
                        </div>`;
                    return;
                }

                const product = products[0];

                // ============================================================
                //  STOCK STATUS CHECK — Normalised (lowercase, trimmed)
                //  BUG FIX: All checks now use cleanStatus consistently
                // ============================================================
                const cleanStatus = (product.stock_status || 'in stock').trim().toLowerCase();
                const isOutOfStock = ['out of stock', 'sold out', 'not in stock'].includes(cleanStatus);
                const isFewLeft    = ['only a few left', 'few left', 'limited stock'].includes(cleanStatus);

                // ============================================================
                //  RENDER BASIC PRODUCT INFO
                // ============================================================
                document.title = `${product.name} | SmartBudget Store`;
                document.getElementById('breadcrumb-name').textContent = product.name;

                document.getElementById('prod-name').textContent    = product.name;
                document.getElementById('prod-price').textContent   = product.price.toLocaleString('en-IN');
                document.getElementById('prod-mrp').textContent     = (product.mrp || 0).toLocaleString('en-IN');
                document.getElementById('prod-discount').textContent = `${product.discount}% OFF`;
                document.getElementById('prod-img').src             = product.image_url;
                document.getElementById('prod-img').alt             = product.name;
                document.getElementById('prod-desc').textContent    = product.description || 'Standard quality product. Verify details on delivery.';

                // ============================================================
                //  STOCK STATUS BANNER RENDERING
                // ============================================================
                const stockBanner = document.getElementById('prod-stock-banner');

                if (isOutOfStock) {
                    stockBanner.style.cssText = 'background:#fee2e2;color:#dc2626;border-left-color:#dc2626;';
                    stockBanner.innerHTML     = `❌ <strong>Out of Stock!</strong> This item is currently unavailable.`;
                } else if (isFewLeft) {
                    stockBanner.style.cssText = 'background:#fffbeb;color:#b45309;border-left-color:#f59e0b;';
                    stockBanner.innerHTML     = `⏳ <strong>Hurry!</strong> Only a few units left. Order before it sells out!`;
                } else {
                    stockBanner.style.cssText = 'background:#ecfdf5;color:#065f46;border-left-color:#10b981;';
                    stockBanner.innerHTML     = `✅ <strong>In Stock</strong> — Ready to ship with instant confirmation.`;
                }

                // ============================================================
                //  CHECKOUT URL & BUTTON STATES
                // ============================================================
                const checkoutUrl = `checkout.html?id=${product.product_id}&name=${encodeURIComponent(product.name.replace(/\s+/g, '-'))}&price=${product.price}&udiscount=${product.upi_discount || 0}`;

                const desktopBtn = document.getElementById('buy-btn-desktop');
                const mobileBtn  = document.getElementById('buy-btn-mobile');

                if (isOutOfStock) {
                    desktopBtn.classList.add('disabled-btn');
                    desktopBtn.textContent = '❌ Sold Out';
                    mobileBtn.classList.add('disabled-btn');
                    mobileBtn.textContent  = 'SOLD OUT';
                } else {
                    desktopBtn.href = checkoutUrl;
                    mobileBtn.href  = checkoutUrl;
                }

                // ============================================================
                //  DYNAMIC TRUST BADGES
                // ============================================================
                const badgesGrid = document.getElementById('dynamic-badges-grid');
                if (product.is_free_delivery) {
                    badgesGrid.innerHTML += `<div class="trust-badge"><span class="icon">🚚</span><span class="text">Free Delivery</span></div>`;
                }
                if (product.is_cod_available) {
                    badgesGrid.innerHTML += `<div class="trust-badge"><span class="icon">💵</span><span class="text">Cash on Delivery</span></div>`;
                }
                if (isFewLeft) {
                    badgesGrid.innerHTML += `<div class="trust-badge"><span class="icon">⏳</span><span class="text">Limited Stock</span></div>`;
                }

                // ============================================================
                //  SPECIFICATIONS PARSER (Key: Value format, one per line)
                // ============================================================
                const specsContainer = document.getElementById('prod-specs');
                if (product.specs && product.specs.trim()) {
                    const lines = product.specs.split('\n');
                    let specsHtml = '';
                    lines.forEach(line => {
                        const colonIdx = line.indexOf(':');
                        if (colonIdx > -1) {
                            const key = line.substring(0, colonIdx).trim();
                            const val = line.substring(colonIdx + 1).trim();
                            if (key && val) {
                                specsHtml += `<li><strong>${key}:</strong> <span>${val}</span></li>`;
                            }
                        }
                    });
                    specsContainer.innerHTML = specsHtml || '<li>Specifications available on product delivery.</li>';
                } else {
                    specsContainer.innerHTML = '<li>Specifications available on product delivery.</li>';
                }

                // ============================================================
                //  SHOW LAYOUT, HIDE LOADER
                // ============================================================
                loadingScreen.style.display        = 'none';
                document.getElementById('main-product-layout').style.display = 'grid';

                // ============================================================
                //  MOBILE STICKY BAR
                //  BUG FIX: Was using raw product.stock_status (case-sensitive).
                //  Now uses normalised cleanStatus consistently.
                // ============================================================
                if (window.innerWidth <= 768 && !isOutOfStock) {
                    document.getElementById('sticky-price').textContent = product.price.toLocaleString('en-IN');
                    document.getElementById('sticky-mrp').textContent   = (product.mrp || 0).toLocaleString('en-IN');
                    document.getElementById('mobile-footer-bar').style.display = 'flex';
                }

            } catch (err) {
                document.getElementById('loading-screen').innerHTML =
                    `<div style="color:#ef4444;">❌ System Error: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
