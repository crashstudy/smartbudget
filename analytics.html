<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard | SmartBudget Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e9ecf1 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e293b;
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .header p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .time-range-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-range {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            background: #f1f5f9;
            color: #475569;
            transition: all 0.2s;
        }

        .btn-range.active {
            background: #3b82f6;
            color: white;
        }

        .btn-range:hover {
            transform: translateY(-2px);
        }

        /* KPI CARDS */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px solid;
        }

        .kpi-card.revenue {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border-color: #6ee7b7;
        }

        .kpi-card.orders {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-color: #93c5fd;
        }

        .kpi-card.avg {
            background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%);
            border-color: #fbbf24;
        }

        .kpi-card.growth {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border-color: #fca5a5;
        }

        .kpi-label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-revenue .kpi-label { color: #047857; }
        .kpi-orders .kpi-label { color: #1e40af; }
        .kpi-avg .kpi-label { color: #92400e; }
        .kpi-growth .kpi-label { color: #991b1b; }

        .kpi-value {
            font-size: 2.2rem;
            font-weight: 900;
            color: #1e293b;
        }

        .kpi-subtext {
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* CHARTS GRID */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .chart-card h3 {
            color: #1e293b;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.2rem;
            color: #3b82f6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ✅ LOGIN PROTECTION -->
    <script>
        (async () => {
            const SUPABASE_URL = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
            const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await _sb.auth.getSession();
            if (!session) window.location.href = 'login.html';
        })();
    </script>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📊 Analytics Dashboard</h1>
            <p>Business insights and performance metrics</p>

            <div class="time-range-buttons">
                <button class="btn-range active" onclick="changeTimeRange('7days')">📅 Last 7 Days</button>
                <button class="btn-range" onclick="changeTimeRange('30days')">📅 Last 30 Days</button>
                <button class="btn-range" onclick="changeTimeRange('90days')">📅 Last 90 Days</button>
                <button class="btn-range" onclick="changeTimeRange('all')">📅 All Time</button>
            </div>
        </div>

        <!-- KPI CARDS -->
        <div class="kpi-grid">
            <div class="kpi-card revenue">
                <div class="kpi-label">💰 Total Revenue</div>
                <div class="kpi-value" id="kpi-revenue">₹0</div>
            </div>

            <div class="kpi-card orders">
                <div class="kpi-label">📦 Total Orders</div>
                <div class="kpi-value" id="kpi-orders">0</div>
            </div>

            <div class="kpi-card avg">
                <div class="kpi-label">📊 Avg Order Value</div>
                <div class="kpi-value" id="kpi-avg">₹0</div>
            </div>

            <div class="kpi-card growth">
                <div class="kpi-label">📈 Month Growth</div>
                <div class="kpi-value" id="kpi-growth">0%</div>
                <div class="kpi-subtext" id="kpi-growth-text">vs last month</div>
            </div>
        </div>

        <!-- CHARTS ROW 1 -->
        <div class="charts-row">
            <!-- Revenue Trend -->
            <div class="chart-card">
                <h3>💹 Revenue Trend</h3>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <!-- Top Products -->
            <div class="chart-card">
                <h3>🔥 Top 5 Products</h3>
                <div class="chart-container">
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- CHARTS ROW 2 -->
        <div class="charts-row">
            <!-- Payment Method -->
            <div class="chart-card">
                <h3>💳 Payment Method Split</h3>
                <div class="chart-container">
                    <canvas id="paymentChart"></canvas>
                </div>
            </div>

            <!-- Order Status -->
            <div class="chart-card">
                <h3>📍 Order Status Breakdown</h3>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ════════════════════════════════════════════════════════════════
        // ANALYTICS ENGINE
        // ════════════════════════════════════════════════════════════════

        const SUPABASE_URL = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTimeRange = '30days';
        let chartInstances = {};

        // ────────────────────────────────────────────────────────────────
        // CHANGE TIME RANGE
        // ────────────────────────────────────────────────────────────────
        function changeTimeRange(range) {
            currentTimeRange = range;

            // Update button active state
            document.querySelectorAll('.btn-range').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Reload data
            loadAnalytics();
        }

        // ────────────────────────────────────────────────────────────────
        // LOAD ANALYTICS DATA
        // ────────────────────────────────────────────────────────────────
        async function loadAnalytics() {
            try {
                // Fetch orders
                const { data: orders, error } = await db
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error || !orders) {
                    console.error('Error:', error);
                    return;
                }

                // ─── FILTER BY TIME RANGE ───────────────────────────
                const now = new Date();
                let daysBack = 30;
                if (currentTimeRange === '7days') daysBack = 7;
                else if (currentTimeRange === '90days') daysBack = 90;
                else if (currentTimeRange === 'all') daysBack = 9999;

                const cutoffDate = new Date(now.getTime() - daysBack * 24 * 60 * 60 * 1000);
                const filtered = orders.filter(o => new Date(o.created_at) >= cutoffDate);

                // ─── CALCULATE KPIs ─────────────────────────────────
                const delivered = filtered.filter(o => o.status === 'Delivered');
                const totalRevenue = delivered.reduce((sum, o) => sum + (o.price || 0), 0);
                const totalOrders = delivered.length;
                const avgOrderValue = totalOrders > 0 ? Math.round(totalRevenue / totalOrders) : 0;

                // Month growth
                const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);

                const thisMonthOrders = filtered.filter(
                    o => new Date(o.created_at) >= thisMonthStart && new Date(o.created_at) <= now
                );
                const lastMonthOrders = filtered.filter(
                    o => new Date(o.created_at) >= lastMonthStart && new Date(o.created_at) <= lastMonthEnd
                );

                const thisMonthRevenue = thisMonthOrders.reduce((sum, o) => sum + (o.price || 0), 0);
                const lastMonthRevenue = lastMonthOrders.reduce((sum, o) => sum + (o.price || 0), 0);
                const monthGrowth = lastMonthRevenue > 0
                    ? Math.round(((thisMonthRevenue - lastMonthRevenue) / lastMonthRevenue) * 100)
                    : 0;

                // UPDATE KPI CARDS
                document.getElementById('kpi-revenue').textContent = `₹${totalRevenue.toLocaleString('en-IN')}`;
                document.getElementById('kpi-orders').textContent = totalOrders;
                document.getElementById('kpi-avg').textContent = `₹${avgOrderValue.toLocaleString('en-IN')}`;
                document.getElementById('kpi-growth').textContent = (monthGrowth > 0 ? '+' : '') + monthGrowth + '%';
                document.getElementById('kpi-growth-text').textContent = monthGrowth > 0 ? '↑ vs last month' : monthGrowth < 0 ? '↓ vs last month' : '→ no change';
                document.getElementById('kpi-growth-text').style.color = monthGrowth > 0 ? '#16a34a' : monthGrowth < 0 ? '#dc2626' : '#64748b';

                // ─── PREPARE CHART DATA ─────────────────────────────

                // Revenue by date
                const revenueByDate = {};
                filtered.forEach(o => {
                    const date = new Date(o.created_at).toLocaleDateString('en-IN');
                    revenueByDate[date] = (revenueByDate[date] || 0) + (o.price || 0);
                });

                const revenueChartData = Object.entries(revenueByDate)
                    .sort((a, b) => new Date(a[0]) - new Date(b[0]))
                    .slice(-30)
                    .map(([date, revenue]) => ({ date, revenue }));

                // Top products
                const productCounts = {};
                filtered.forEach(o => {
                    productCounts[o.product_name] = (productCounts[o.product_name] || 0) + 1;
                });

                const topProductsData = Object.entries(productCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([name, count]) => ({ name: name.substring(0, 20) + '...', orders: count }));

                // Payment method
                const paymentCounts = {};
                filtered.forEach(o => {
                    const method = o.payment_method || 'Unknown';
                    paymentCounts[method] = (paymentCounts[method] || 0) + 1;
                });

                const paymentChartData = Object.entries(paymentCounts).map(([name, value]) => ({
                    name,
                    value
                }));

                // Order status
                const statusCounts = {};
                filtered.forEach(o => {
                    const status = o.status || 'Unknown';
                    statusCounts[status] = (statusCounts[status] || 0) + 1;
                });

                const statusChartData = Object.entries(statusCounts).map(([name, value]) => ({
                    name,
                    value
                }));

                // ─── RENDER CHARTS ──────────────────────────────────
                renderCharts(revenueChartData, topProductsData, paymentChartData, statusChartData);

            } catch (err) {
                console.error('Analytics error:', err);
            }
        }

        // ────────────────────────────────────────────────────────────────
        // RENDER CHARTS
        // ────────────────────────────────────────────────────────────────
        function renderCharts(revenueData, topProducts, paymentData, statusData) {
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];

            // Destroy existing charts
            Object.values(chartInstances).forEach(chart => {
                if (chart) chart.destroy();
            });

            // REVENUE TREND
            chartInstances.revenue = new Chart(document.getElementById('revenueChart'), {
                type: 'line',
                data: {
                    labels: revenueData.map(d => d.date),
                    datasets: [{
                        label: 'Daily Revenue',
                        data: revenueData.map(d => d.revenue),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#3b82f6',
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '₹' + value.toLocaleString('en-IN');
                                }
                            }
                        }
                    }
                }
            });

            // TOP PRODUCTS
            chartInstances.topProducts = new Chart(document.getElementById('topProductsChart'), {
                type: 'bar',
                data: {
                    labels: topProducts.map(p => p.name),
                    datasets: [{
                        label: 'Orders',
                        data: topProducts.map(p => p.orders),
                        backgroundColor: '#f59e0b',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            // PAYMENT METHOD
            chartInstances.payment = new Chart(document.getElementById('paymentChart'), {
                type: 'doughnut',
                data: {
                    labels: paymentData.map(p => p.name),
                    datasets: [{
                        data: paymentData.map(p => p.value),
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            // ORDER STATUS
            chartInstances.status = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: statusData.map(s => s.name),
                    datasets: [{
                        data: statusData.map(s => s.value),
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // Load on page open
        loadAnalytics();
    </script>
</body>
</html>
