<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SmartBudget</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fb; margin: 0; padding: 20px; }
        .dashboard { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 1.5rem; }
        
        /* Mobile ke liye scrollable table wrapper */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 20px; -webkit-overflow-scrolling: touch; }
        
        table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 0.9rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; }
        
        .status-select { padding: 6px; border-radius: 4px; border: 1px solid #cbd5e1; }
        .btn-update { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px;}
        .btn-update:hover { background: #2563eb; }
        
        .address-box { max-width: 250px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>

    <script>
        const pass = prompt("Enter Admin Password:");
        if (pass !== "Satyam@123") {
            document.body.innerHTML = "<h2 style='text-align:center; color:red; margin-top:50px;'>Access Denied!</h2>";
            throw new Error("Unauthorized"); 
        }
    </script>

    <div class="dashboard">
        <h1>🛠️ Orders Control Room (Admin)</h1>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Order ID</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Customer</th>
                        <th>Address & PIN</th>
                        <th>Status Action</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="7" style="text-align: center; font-weight: bold;">Loading Orders... Please wait.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
        const supabaseKey = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchOrders() {
            const tbody = document.getElementById('orders-table-body');
            try {
                const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
                
                if (error) {
                    tbody.innerHTML = `<tr><td colspan='7' style='color:red; text-align:center; font-weight:bold;'>Database Error: ${error.message}</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='7' style='text-align: center; color:var(--muted);'>No orders found yet.</td></tr>";
                    return;
                }

                tbody.innerHTML = ""; // Clear loading text
                data.forEach(order => {
                    const date = new Date(order.created_at).toLocaleDateString('en-IN');
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${date}</td>
                        <td><strong>${order.order_id}</strong></td>
                        <td style="color: #3b82f6; font-weight: bold;">${order.product_name}</td>
                        <td>₹${order.price}</td>
                        <td><strong>${order.customer_name}</strong><br>📞 ${order.phone}</td>
                        <td><div class="address-box">${order.address} <br><strong>PIN: ${order.pincode}</strong></div></td>
                        <td>
                            <select id="status-${order.id}" class="status-select">
                                <option value="Order Received" ${order.status === 'Order Received' ? 'selected' : ''}>Order Received</option>
                                <option value="Order Processed" ${order.status === 'Order Processed' ? 'selected' : ''}>Order Processed</option>
                                <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="Out for Delivery" ${order.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                                <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                            <br><button class="btn-update" onclick="updateStatus('${order.id}')">Save</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan='7' style='color:red; text-align:center;'>System Error: ${err.message}</td></tr>`;
            }
        }

        async function updateStatus(id) {
            const newStatus = document.getElementById(`status-${id}`).value;
            const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', id);
            
            if (error) alert("Error updating status: " + error.message);
            else alert("Status Updated Successfully! Customer ko bhi ab naya status dikhega.");
        }

        fetchOrders();
    </script>
</body>
</html>
