<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SmartBudget</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f4f7fb 0%, #e9ecf1 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .dashboard { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        
        h1 { 
            color: #1e293b; 
            border-bottom: 3px solid #3b82f6; 
            padding-bottom: 15px; 
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        /* Filter & Stats Section */
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 18px;
            border: 2px solid #e2e8f0;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .stats-box {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #10b981;
        }

        .stat-card.pending {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border-left-color: #f59e0b;
        }

        .stat-number { font-size: 1.8rem; font-weight: bold; color: #1e293b; }
        .stat-label { font-size: 0.85rem; color: #64748b; margin-top: 5px; }

        /* Mobile scrollable table wrapper */
        .table-responsive { 
            width: 100%; 
            overflow-x: auto; 
            margin-top: 20px; 
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 1100px; 
            font-size: 0.9rem; 
        }

        th { 
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #475569; 
            padding: 14px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid #cbd5e1;
        }

        td { 
            padding: 14px; 
            border-bottom: 1px solid #e2e8f0; 
            color: #475569;
        }

        tr:hover { background: #f8fafc; }
        
        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }

        .status-badge.received {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-badge.processed {
            background: #e0e7ff;
            color: #3730a3;
        }

        .status-badge.shipped {
            background: #fef3c7;
            color: #92400e;
        }

        .status-badge.delivery {
            background: #fed7aa;
            color: #9a3412;
        }

        .status-badge.delivered {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.review {
            background: #f0fdf4;
            color: #166534;
            border: 2px solid #f59e0b;
        }

        .status-badge.approved {
            background: #dcfce7;
            color: #15803d;
            border: 2px solid #22c55e;
        }

        .status-badge.rejected {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        /* Payment Method Badge */
        .payment-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .payment-badge.cod {
            background: #dbeafe;
            color: #1e40af;
        }

        .payment-badge.upi {
            background: #fce7f3;
            color: #be185d;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-update, .btn-approve, .btn-reject {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-update {
            background: #3b82f6;
            color: white;
        }

        .btn-update:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-approve {
            background: #10b981;
            color: white;
        }

        .btn-approve:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-reject {
            background: #ef4444;
            color: white;
        }

        .btn-reject:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-update:disabled, .btn-approve:disabled, .btn-reject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Address Box */
        .address-box { 
            max-width: 280px; 
            font-size: 0.85rem; 
            color: #64748b;
            line-height: 1.4;
        }

        /* UTR Box */
        .utr-box {
            font-family: 'Courier New', monospace;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .utr-box.empty {
            color: #94a3b8;
            font-style: italic;
        }

        /* Status Select */
        .status-select { 
            padding: 8px 12px; 
            border-radius: 6px; 
            border: 2px solid #cbd5e1;
            background: #fff;
            font-weight: 600;
            transition: border-color 0.3s;
        }

        .status-select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Modal for UTR Details */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        .modal-content {
            background-color: #fff;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-close {
            color: #999;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #1e293b;
        }

        .modal h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .modal-field {
            margin-bottom: 15px;
        }

        .modal-field label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #475569;
        }

        .modal-field input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        @media (max-width: 1024px) {
            .dashboard { padding: 20px; }
            h1 { font-size: 1.5rem; }
            th, td { padding: 10px; font-size: 0.85rem; }
            .address-box { max-width: 200px; }
        }

        @media (max-width: 768px) {
            .dashboard { padding: 15px; }
            h1 { font-size: 1.3rem; }
            .filter-section { flex-direction: column; }
            .filter-btn { width: 100%; }
            th, td { padding: 8px; font-size: 0.8rem; }
            .action-buttons { flex-direction: column; }
            .btn-update, .btn-approve, .btn-reject { width: 100%; }
        }
    </style>
</head>
<body>

    <script>
        const pass = prompt("Enter Admin Password:");
        if (pass !== "Satyam@123") {
            document.body.innerHTML = "<h2 style='text-align:center; color:red; margin-top:50px;'>Access Denied!</h2>";
            throw new Error("Unauthorized"); 
        }
    </script>

    <div class="dashboard">
        <h1>🛠️ Orders Control Room (Admin)</h1>
        
        <!-- Stats Section -->
        <div class="stats-box" id="statsBox">
            <div class="stat-card">
                <div class="stat-number" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-number" id="pendingOrders">0</div>
                <div class="stat-label">Payment Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="deliveredOrders">0</div>
                <div class="stat-label">Delivered</div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All Orders</button>
            <button class="filter-btn" data-filter="review">⏳ Pending Review</button>
            <button class="filter-btn" data-filter="delivered">✅ Delivered</button>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>📅 Date</th>
                        <th>🆔 Order ID</th>
                        <th>📦 Product</th>
                        <th>💰 Price</th>
                        <th>👤 Customer</th>
                        <th>📍 Address</th>
                        <th>💳 Payment</th>
                        <th>📝 UTR Number</th>
                        <th>✏️ Status Action</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="9" style="text-align: center; font-weight: bold; color: #3b82f6;">Loading Orders... Please wait.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Payment Details -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <h2>💳 Review Payment</h2>
            <div class="modal-field">
                <label>Order ID:</label>
                <input type="text" id="modalOrderId" readonly>
            </div>
            <div class="modal-field">
                <label>Customer Name:</label>
                <input type="text" id="modalCustomerName" readonly>
            </div>
            <div class="modal-field">
                <label>Amount:</label>
                <input type="text" id="modalAmount" readonly>
            </div>
            <div class="modal-field">
                <label>Payment Method:</label>
                <input type="text" id="modalPaymentMethod" readonly>
            </div>
            <div class="modal-field">
                <label>UTR Number:</label>
                <input type="text" id="modalUtrNumber" readonly>
            </div>
            <div class="modal-buttons">
                <button style="background: #10b981; color: white;" id="approvePaymentBtn">✅ Approve Payment</button>
                <button style="background: #ef4444; color: white;" id="rejectPaymentBtn">❌ Reject Payment</button>
                <button style="background: #94a3b8; color: white;" id="closeModalBtn">Close</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
        const supabaseKey = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let allOrders = [];
        let currentFilter = 'all';
        let reviewingOrder = null;

        async function fetchOrders() {
            const tbody = document.getElementById('orders-table-body');
            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    tbody.innerHTML = `<tr><td colspan='9' style='color:red; text-align:center; font-weight:bold;'>Database Error: ${error.message}</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='9' style='text-align: center; color:#999;'>No orders found yet.</td></tr>";
                    return;
                }

                allOrders = data;
                updateStats();
                renderOrders();

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan='9' style='color:red; text-align:center;'>System Error: ${err.message}</td></tr>`;
            }
        }

        function updateStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(o => o.status === 'Payment Under Review').length;
            const delivered = allOrders.filter(o => o.status === 'Delivered').length;

            document.getElementById('totalOrders').innerText = total;
            document.getElementById('pendingOrders').innerText = pending;
            document.getElementById('deliveredOrders').innerText = delivered;
        }

        function renderOrders() {
            const tbody = document.getElementById('orders-table-body');
            const filtered = currentFilter === 'all' 
                ? allOrders 
                : currentFilter === 'review'
                ? allOrders.filter(o => o.status === 'Payment Under Review')
                : allOrders.filter(o => o.status === 'Delivered');

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan='9' style='text-align: center; color:#999;'>No orders found for this filter.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(order => {
                const date = new Date(order.created_at).toLocaleDateString('en-IN');
                const paymentMethod = order.payment_method || 'Cash on Delivery';
                const isUPI = paymentMethod === 'Prepaid UPI';
                const statusColor = getStatusColor(order.status);
                
                return `
                    <tr>
                        <td>${date}</td>
                        <td><strong style="color: #3b82f6;">${order.order_id}</strong></td>
                        <td style="color: #3b82f6; font-weight: 700;">${order.product_name}</td>
                        <td><strong>₹${order.price}</strong></td>
                        <td>
                            <strong>${order.customer_name}</strong>
                            <br>
                            <span style="font-size: 0.8rem; color: #64748b;">📞 ${order.phone}</span>
                        </td>
                        <td>
                            <div class="address-box">
                                ${order.address}<br>
                                <strong>PIN: ${order.pincode}</strong>
                            </div>
                        </td>
                        <td>
                            <span class="payment-badge ${isUPI ? 'upi' : 'cod'}">
                                ${isUPI ? '💳 Prepaid UPI' : '🚚 Cash on Delivery'}
                            </span>
                        </td>
                        <td>
                            ${order.utr_number 
                                ? `<div class="utr-box">${order.utr_number}</div>` 
                                : `<div class="utr-box empty">—</div>`
                            }
                        </td>
                        <td>
                            <div class="action-buttons">
                                ${order.status === 'Payment Under Review' 
                                    ? `
                                        <button class="btn-approve" onclick="openPaymentReview('${order.id}')">Review Payment</button>
                                        <button class="btn-reject" onclick="deleteOrder('${order.id}', '${order.order_id}')">🗑️ Delete</button>
                                    `
                                    : `
                                        <select id="status-${order.id}" class="status-select">
                                            <option value="Awaiting Payment" ${order.status === 'Awaiting Payment' ? 'selected' : ''}>⏳ Awaiting Payment</option>
                                            <option value="Payment Under Review" ${order.status === 'Payment Under Review' ? 'selected' : ''}>🔍 Payment Under Review</option>
                                            <option value="Payment Approved" ${order.status === 'Payment Approved' ? 'selected' : ''}>✅ Payment Approved</option>
                                            <option value="Payment Rejected" ${order.status === 'Payment Rejected' ? 'selected' : ''}>❌ Payment Rejected</option>
                                            <option value="Order Received" ${order.status === 'Order Received' ? 'selected' : ''}>📦 Order Received</option>
                                            <option value="Order Processed" ${order.status === 'Order Processed' ? 'selected' : ''}>⚙️ Order Processed</option>
                                            <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>🚚 Shipped</option>
                                            <option value="Out for Delivery" ${order.status === 'Out for Delivery' ? 'selected' : ''}>🏃 Out for Delivery</option>
                                            <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>✔️ Delivered</option>
                                        </select>
                                        <button class="btn-update" onclick="updateStatus('${order.id}')">Save</button>
                                        <button class="btn-reject" onclick="deleteOrder('${order.id}', '${order.order_id}')" style="margin-top: 5px;">🗑️ Delete</button>
                                    `
                                }
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatusColor(status) {
            const colors = {
                'Order Received': 'received',
                'Order Processed': 'processed',
                'Shipped': 'shipped',
                'Out for Delivery': 'delivery',
                'Delivered': 'delivered',
                'Payment Under Review': 'review',
                'Payment Approved': 'approved',
                'Payment Rejected': 'rejected',
                'Awaiting Payment': 'review'
            };
            return colors[status] || 'received';
        }

        async function updateStatus(id) {
            const newStatus = document.getElementById(`status-${id}`).value;
            const { error } = await supabaseClient
                .from('orders')
                .update({ status: newStatus })
                .eq('id', id);
            
            if (error) {
                alert("❌ Error updating status: " + error.message);
            } else {
                alert("✅ Status Updated Successfully!");
                fetchOrders();
            }
        }

        async function deleteOrder(id, orderId) {
            const confirm = prompt(`⚠️ Type "${orderId}" to confirm deletion of this order:`);
            if (confirm !== orderId) {
                alert("❌ Deletion cancelled or incorrect Order ID!");
                return;
            }

            const { error } = await supabaseClient
                .from('orders')
                .delete()
                .eq('id', id);

            if (error) {
                alert("❌ Error deleting order: " + error.message);
            } else {
                alert("✅ Order deleted successfully!");
                fetchOrders();
            }
        }

        window.deleteOrder = deleteOrder;

        function openPaymentReview(orderId) {
            reviewingOrder = allOrders.find(o => o.id === orderId);
            if (!reviewingOrder) {
                alert("❌ Order not found!");
                return;
            }

            // Populate modal fields
            document.getElementById('modalOrderId').value = reviewingOrder.order_id;
            document.getElementById('modalCustomerName').value = reviewingOrder.customer_name;
            document.getElementById('modalAmount').value = `₹${reviewingOrder.price}`;
            document.getElementById('modalPaymentMethod').value = reviewingOrder.payment_method || 'Unknown';
            document.getElementById('modalUtrNumber').value = reviewingOrder.utr_number || 'Not provided';

            // Show modal
            const modal = document.getElementById('paymentModal');
            modal.style.display = 'block';
            
            // Reset button states
            document.getElementById('approvePaymentBtn').disabled = false;
            document.getElementById('approvePaymentBtn').innerHTML = '✅ Approve Payment';
            document.getElementById('rejectPaymentBtn').disabled = false;
            document.getElementById('rejectPaymentBtn').innerHTML = '❌ Reject Payment';
        }

        window.openPaymentReview = openPaymentReview;

        async function approvePayment() {
            if (!reviewingOrder) return;

            document.getElementById('approvePaymentBtn').disabled = true;
            const { error } = await supabaseClient
                .from('orders')
                .update({ status: 'Payment Approved' })
                .eq('id', reviewingOrder.id);

            if (error) {
                alert("❌ Error approving payment: " + error.message);
                document.getElementById('approvePaymentBtn').disabled = false;
            } else {
                alert("✅ Payment Approved! Order status updated.");
                document.getElementById('paymentModal').style.display = 'none';
                fetchOrders();
            }
        }

        async function rejectPayment() {
            if (!reviewingOrder) return;

            const reason = prompt("Enter rejection reason (if any):");
            document.getElementById('rejectPaymentBtn').disabled = true;

            const { error } = await supabaseClient
                .from('orders')
                .update({ status: 'Payment Rejected' })
                .eq('id', reviewingOrder.id);

            if (error) {
                alert("❌ Error rejecting payment: " + error.message);
                document.getElementById('rejectPaymentBtn').disabled = false;
            } else {
                alert("✅ Payment Rejected! Customer needs to resubmit.");
                document.getElementById('paymentModal').style.display = 'none';
                fetchOrders();
            }
        }

        // Modal Control - Setup Event Listeners
        const modal = document.getElementById('paymentModal');
        const closeModalBtn = document.getElementById('closeModal');
        const closeModalBtnBottom = document.getElementById('closeModalBtn');
        const approveBtn = document.getElementById('approvePaymentBtn');
        const rejectBtn = document.getElementById('rejectPaymentBtn');

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            reviewingOrder = null;
        });

        closeModalBtnBottom.addEventListener('click', () => {
            modal.style.display = 'none';
            reviewingOrder = null;
        });

        // Close modal when clicking outside of it
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
                reviewingOrder = null;
            }
        });

        // Setup button listeners
        approveBtn.addEventListener('click', async () => {
            if (!reviewingOrder) return;
            
            const reason = prompt("Enter approval note (optional):");
            approveBtn.disabled = true;
            approveBtn.innerHTML = '<span class="loading-spinner"></span> Approving...';

            const { error } = await supabaseClient
                .from('orders')
                .update({ 
                    status: 'Payment Approved',
                    admin_note: reason || ''
                })
                .eq('id', reviewingOrder.id);

            if (error) {
                alert("❌ Error approving payment: " + error.message);
                approveBtn.disabled = false;
                approveBtn.innerHTML = '✅ Approve Payment';
            } else {
                alert("✅ Payment Approved! Order moved to processing.");
                modal.style.display = 'none';
                approveBtn.innerHTML = '✅ Approve Payment';
                fetchOrders();
            }
        });

        rejectBtn.addEventListener('click', async () => {
            if (!reviewingOrder) return;
            
            const reason = prompt("Enter rejection reason (visible to customer):");
            if (!reason) {
                alert("❌ Please provide a rejection reason!");
                return;
            }

            rejectBtn.disabled = true;
            rejectBtn.innerHTML = '<span class="loading-spinner"></span> Rejecting...';

            const { error } = await supabaseClient
                .from('orders')
                .update({ 
                    status: 'Payment Rejected',
                    admin_note: reason
                })
                .eq('id', reviewingOrder.id);

            if (error) {
                alert("❌ Error rejecting payment: " + error.message);
                rejectBtn.disabled = false;
                rejectBtn.innerHTML = '❌ Reject Payment';
            } else {
                alert("✅ Payment Rejected! Customer will need to resubmit.");
                modal.style.display = 'none';
                rejectBtn.innerHTML = '❌ Reject Payment';
                fetchOrders();
            }
        });

        // Filter Buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderOrders();
            });
        });

        // Initial Load
        fetchOrders();
