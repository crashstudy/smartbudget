<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | SmartBudget</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f4f7fb 0%, #e9ecf1 100%);
            padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .form-container { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 850px; }
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        h2 { color: #1e293b; font-size: 1.6rem; }
        .btn-back { background: #f1f5f9; color: #475569; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 700; border: 1px solid #cbd5e1; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-weight: 700; color: #475569; font-size: 0.95rem; }
        .form-group input, .form-group textarea, .form-group select { padding: 14px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; background: #f8fafc; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #3b82f6; background: #fff; }
        .checkbox-group { display: flex; gap: 30px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 2px solid #cbd5e1; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; color: #475569; }
        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }
        .btn-submit { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 16px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 800; cursor: pointer; width: 100%; transition: all 0.3s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body>

    <script>
        const pass = prompt("Enter Admin Password:");
        if (pass !== "Satyam@123") {
            document.body.innerHTML = "<h2 style='text-align:center; color:red; margin-top:50px;'>Access Denied!</h2>";
            throw new Error("Unauthorized"); 
        }
    </script>

    <div class="form-container">
        <div class="header-box">
            <h2>🛒 SmartBudget Advanced Product GUI</h2>
            <a href="admin.html" class="btn-back">⬅ Back to Orders</a>
        </div>
        
        <form id="addProductForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Product ID (Unique Short Name)</label>
                    <input type="text" id="p_id" placeholder="e.g. M10-TWS" required style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Product Full Name</label>
                    <input type="text" id="p_name" placeholder="e.g. M10 TWS Wireless Earbuds" required>
                </div>
                
                <div class="form-group">
                    <label>Selling Price (₹)</label>
                    <input type="number" id="p_price" placeholder="e.g. 399" required oninput="calculateMRP()">
                </div>
                <div class="form-group">
                    <label>Discount Percentage (%)</label>
                    <input type="number" id="p_discount" placeholder="e.g. 65" required oninput="calculateMRP()">
                </div>

                <div class="form-group">
                    <label>Auto-Calculated MRP (Strikethrough Price)</label>
                    <input type="number" id="p_mrp" readonly placeholder="Calculates automatically...">
                </div>
                <div class="form-group">
                    <label>Stock Availability Status</label>
                    <select id="p_stock" required>
                        <option value="In Stock">✅ In Stock (Available)</option>
                        <option value="Only a Few Left">⏳ Only a Few Left (Urgency Mode)</option>
                        <option value="Out of Stock">❌ Out of Stock (Disabled)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Additional Feature Options</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" id="p_delivery" checked> 🚚 Free Delivery Available</label>
                        <label class="checkbox-item"><input type="checkbox" id="p_cod" checked> 💵 Cash on Delivery (COD) Available</label>
                    </div>
                </div>

                <!-- NEW: UPI Prepaid Discount -->
                <div class="form-group">
                    <label>💳 UPI Prepaid Discount (₹) — Amount deducted when customer pays online</label>
                    <input type="number" id="p_upi_discount" placeholder="e.g. 25" value="25" min="0" max="9999">
                    <small style="color:#10b981;font-weight:600;margin-top:5px;display:block;">
                        ✅ This exact amount will show on checkout as "Pay Now & Save ₹XX". Enter 0 for no discount.
                    </small>
                </div>

                <div class="form-group">
                    <label>🚚 Delivery Charge (₹)</label>
                    <input type="number" id="p_delivery_charge" placeholder="e.g. 40" value="0" min="0" max="500">
                    <small style="color:#64748b;font-weight:600;margin-top:5px;display:block;">
                        Leave as 0 for Free Delivery.
                    </small>
                </div>


                <div class="form-group full-width">
                    <label>Image URL (Link)</label>
                    <input type="text" id="p_image" placeholder="Paste image link here" required>
                </div>

                <div class="form-group full-width">
                    <label>Product Description (Genuine Selling Points)</label>
                    <textarea id="p_desc" rows="3" placeholder="Enter engaging description details..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label>Product Specifications (Enter each specification on a NEW line in 'Key: Value' format)</label>
                    <textarea id="p_specs" rows="4" placeholder="Bluetooth: Version 5.1&#10;Battery Life: 4-5 Hours&#10;Waterproof: IPX7 Rated"></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitProductBtn">💾 Upload to Database Store</button>
        </form>
    </div>

    <script>
        const supabaseUrl = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
        const supabaseKey = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        function calculateMRP() {
            let price = parseFloat(document.getElementById('p_price').value);
            let discount = parseFloat(document.getElementById('p_discount').value);
            if (price && discount && discount < 100) {
                document.getElementById('p_mrp').value = Math.round(price / (1 - (discount / 100)));
            } else { document.getElementById('p_mrp').value = ''; }
        }

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitProductBtn');
            btn.innerText = "Uploading to Cloud..."; btn.disabled = true;

            const productData = {
                product_id: document.getElementById('p_id').value.trim().toUpperCase().replace(/\s+/g, '-'),
                name: document.getElementById('p_name').value,
                price: parseInt(document.getElementById('p_price').value),
                discount: parseInt(document.getElementById('p_discount').value),
                mrp: parseInt(document.getElementById('p_mrp').value),
                stock_status: document.getElementById('p_stock').value,
                is_free_delivery: document.getElementById('p_delivery').checked,
                is_cod_available: document.getElementById('p_cod').checked,
                upi_discount: parseInt(document.getElementById('p_upi_discount').value) || 0,
                delivery_charge: parseInt(document.getElementById('p_delivery_charge').value) || 0,
                image_url: document.getElementById('p_image').value,
                description: document.getElementById('p_desc').value,
                specs: document.getElementById('p_specs').value
            };

            const { error } = await supabaseClient.from('products').insert([productData]);

            if (error) { alert("❌ Database Error: " + error.message); } 
            else { alert("✅ Product Uploaded! Automatically syncs with Store & Product display pages."); document.getElementById('addProductForm').reset(); }
            btn.innerText = "💾 Upload to Database Store"; btn.disabled = false;
        });
    </script>
</body>
</html>
