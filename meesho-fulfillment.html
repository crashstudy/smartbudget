<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Fulfillment Tracker | SmartBudget Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ✅ LOGIN PROTECTION - PASTE THIS PART -->
    <script>
        (async () => {
            const SUPABASE_URL = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
            const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await _sb.auth.getSession();
            if (!session) window.location.href = 'login.html';
        })();
    </script>
    <!-- ✅ LOGIN PROTECTION ENDS HERE -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e9ecf1 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1e293b;
            margin-bottom: 8px;
            border-bottom: 3px solid #f59e0b;
            padding-bottom: 12px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }

        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-1px); }

        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; transform: translateY(-1px); }

        .btn-meesho { background: #ec4899; color: white; font-size: 0.85rem; padding: 8px 14px; }
        .btn-meesho:hover { background: #db2777; }

        .order-card {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #fcd34d;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            position: relative;
        }

        .order-card.fulfilled {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border-color: #6ee7b7;
            opacity: 0.7;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id {
            font-weight: 800;
            font-size: 1.15rem;
            color: #1e293b;
        }

        .order-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-pending { background: #fecaca; color: #991b1b; }
        .status-fulfilled { background: #bbf7d0; color: #065f46; }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-field {
            border-left: 3px solid #f59e0b;
            padding-left: 12px;
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 0.95rem;
            color: #1e293b;
            font-weight: 600;
        }

        .detail-value.highlight {
            font-size: 1.2rem;
            color: #f59e0b;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-top: 2px dashed #fcd34d;
            padding-top: 12px;
        }

        .status-bar {
            padding: 15px 20px;
            background: #eff6ff;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
            margin-bottom: 25px;
        }

        .status-bar strong { color: #3b82f6; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .order-details { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📦 Meesho Fulfillment Tracker</h1>
        <p class="subtitle">Track orders pending fulfillment from Meesho | Quick order processing</p>

        <div class="status-bar">
            <strong>📋 Status:</strong> Showing orders waiting to be fulfilled from Meesho.
            Search the product name on Meesho, add to cart with <strong>customer's delivery address</strong>, and mark as fulfilled.
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="loadPendingOrders()">🔄 Refresh Orders</button>
            <button class="btn btn-warning" onclick="downloadCSV()">⬇️ Export as CSV</button>
            <button class="btn" style="background:#ef4444;color:white;margin-left:auto;" onclick="logoutAdmin()">🚪 Logout</button>
        </div>

        <div id="orders-container">
            <div style="text-align: center; padding: 40px; color: #3b82f6;">
                ⏳ Loading pending orders...
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ytuvjhjemkzcjldiwafv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadPendingOrders() {
            const container = document.getElementById('orders-container');

            try {
                const { data, error } = await db
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    container.innerHTML = `<div style="color:red;padding:30px;text-align:center;">❌ Error: ${error.message}</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">✅</div>
                            <h3>All caught up!</h3>
                            <p>No pending orders to fulfill from Meesho.</p>
                        </div>`;
                    return;
                }

                // Separate pending and fulfilled
                const pending = data.filter(o => o.status !== 'Delivered' && o.meesho_order_id === null);
                const fulfilled = data.filter(o => o.meesho_order_id !== null);

                let html = '';

                if (pending.length > 0) {
                    html += `<h2 style="color:#f59e0b;margin-bottom:20px;font-size:1.1rem;">⏳ PENDING (${pending.length})</h2>`;
                    html += pending.map(order => generateOrderCard(order, false)).join('');
                }

                if (fulfilled.length > 0) {
                    html += `<h2 style="color:#10b981;margin-top:30px;margin-bottom:20px;font-size:1.1rem;">✅ FULFILLED (${fulfilled.length})</h2>`;
                    html += fulfilled.map(order => generateOrderCard(order, true)).join('');
                }

                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<div style="color:red;padding:30px;text-align:center;">❌ Error: ${err.message}</div>`;
            }
        }

        function generateOrderCard(order, isFulfilled) {
            const statusClass = isFulfilled ? 'fulfilled' : 'pending';
            const statusLabel = isFulfilled ? 'FULFILLED' : 'PENDING';
            const statusBadgeClass = isFulfilled ? 'status-fulfilled' : 'status-pending';

            return `
                <div class="order-card ${statusClass}" id="order-${order.id}">
                    <div class="order-header">
                        <div class="order-id">Order #${order.order_id}</div>
                        <span class="order-status ${statusBadgeClass}">${statusLabel}</span>
                    </div>

                    <div class="order-details">
                        <div class="detail-field">
                            <div class="detail-label">📦 Product</div>
                            <div class="detail-value">${order.product_name}</div>
                        </div>

                        <div class="detail-field">
                            <div class="detail-label">💰 Price (with discount)</div>
                            <div class="detail-value highlight">₹${order.price}</div>
                        </div>

                        <div class="detail-field">
                            <div class="detail-label">👤 Customer Name</div>
                            <div class="detail-value">${order.customer_name}</div>
                        </div>

                        <div class="detail-field">
                            <div class="detail-label">📞 Phone</div>
                            <div class="detail-value"><a href="tel:${order.phone}" style="color:#3b82f6;text-decoration:none;">${order.phone}</a></div>
                        </div>

                        <div class="detail-field">
                            <div class="detail-label">📍 Address</div>
                            <div class="detail-value">${order.address}, PIN: ${order.pincode}</div>
                        </div>

                        <div class="detail-field">
                            <div class="detail-label">💳 Payment</div>
                            <div class="detail-value">${order.payment_method}${order.utr_number ? ` (UTR: ${order.utr_number})` : ''}</div>
                        </div>

                        <div class="detail-field">
                            <div class="detail-label">🔗 Meesho Order ID</div>
                            <div class="detail-value">${order.meesho_order_id || '—'}</div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-meesho" onclick="searchMeesho('${encodeURIComponent(order.product_name)}')">
                            🔍 Search on Meesho
                        </button>
                        ${!isFulfilled ? `
                            <button class="btn btn-success" onclick="markFulfilled('${order.id}')">
                                ✅ Fulfilled (Save Meesho ID)
                            </button>
                        ` : `
                            <button class="btn" style="background:#cbd5e1;color:#64748b;" disabled>
                                ✔️ Already Fulfilled
                            </button>
                        `}
                        <button class="btn" style="background:#f1f5f9;color:#475569;" onclick="copyAddress('${order.address}, ${order.pincode}')">
                            📋 Copy Address
                        </button>
                    </div>
                </div>
            `;
        }

        function searchMeesho(productName) {
            const meeshoUrl = `https://www.meesho.com/search?q=${productName}`;
            window.open(meeshoUrl, '_blank');
        }

        function copyAddress(address) {
            navigator.clipboard.writeText(address);
            alert('✅ Address copied to clipboard!');
        }

        async function markFulfilled(orderId) {
            const meeshoId = prompt('Enter Meesho Order ID (or Order Reference):', '');
            if (!meeshoId) return;

            const { error } = await db
                .from('orders')
                .update({ meesho_order_id: meeshoId })
                .eq('id', orderId);

            if (error) {
                alert('❌ Error: ' + error.message);
            } else {
                alert('✅ Order marked as fulfilled!');
                loadPendingOrders();
            }
        }

        function downloadCSV() {
            const data = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const text = card.innerText;
                data.push(text);
            });

            const csvContent = "data:text/csv;charset=utf-8," + data.join('\n\n');
            const link = document.createElement('a');
            link.setAttribute('href', encodeURI(csvContent));
            link.setAttribute('download', `meesho-orders-${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        }

        // Load on page open
        loadPendingOrders();
        setInterval(loadPendingOrders, 30000); // Refresh every 30s

        // Logout function
        async function logoutAdmin() {
            if (!confirm('Logout from admin panel?')) return;
            await db.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
