<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saviours — Group Order</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#22263a;
  --accent:#f7c948;--red:#ff6b6b;--green:#4ade80;
  --text:#f0f0f5;--muted:#8a8fac;--border:#2e324a;--r:16px;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:48px}

/* HEADER */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:15px 20px;text-align:center;position:sticky;top:0;z-index:100;
}
.logo{font-size:1.2rem;font-weight:900}
.logo em{color:var(--accent);font-style:normal}

/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{
  flex:1;text-align:center;padding:13px 0;font-weight:800;font-size:.88rem;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;
}
.tab.on{color:var(--accent);border-color:var(--accent)}

/* PAGES */
.page{display:none;padding:20px;max-width:460px;margin:0 auto}
.page.on{display:block}

/* LABELS */
.lbl{
  display:block;font-size:.72rem;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;
}

/* NAME INPUT */
.name-inp{
  width:100%;background:var(--card);border:2px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;
  padding:14px 16px;outline:none;margin-bottom:22px;transition:border-color .2s;
}
.name-inp:focus{border-color:var(--accent)}
.name-inp::placeholder{color:var(--border)}

/* ITEMS GRID */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.icard{
  background:var(--card);border:2px solid var(--border);border-radius:var(--r);
  padding:14px 10px;text-align:center;cursor:pointer;user-select:none;
  transition:border-color .15s,background .15s;
}
.icard.on{border-color:var(--accent);background:rgba(247,201,72,.08)}
.icard:active{transform:scale(.97)}
.ie{font-size:2.2rem;display:block;margin-bottom:4px;line-height:1}
.in{font-size:.85rem;font-weight:800;margin-bottom:10px}
.qrow{display:flex;align-items:center;justify-content:center;gap:10px}
.qbtn{
  width:28px;height:28px;border-radius:50%;border:none;background:var(--border);
  color:var(--text);font-size:1.1rem;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;
}
.qbtn:hover{background:var(--accent);color:#000}
.qn{font-size:1rem;font-weight:900;min-width:22px;text-align:center;color:var(--accent)}
.qn.z{color:var(--border)}

/* CUSTOM */
.crow{display:flex;gap:8px;margin-bottom:10px}
.cinp{
  flex:1;background:var(--card);border:2px solid var(--border);border-radius:12px;
  color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;
  padding:12px 14px;outline:none;transition:border-color .2s;
}
.cinp:focus{border-color:var(--accent)}
.cinp::placeholder{color:var(--muted)}
.cqty{
  width:56px;background:var(--card);border:2px solid var(--border);border-radius:12px;
  color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;
  padding:12px 6px;outline:none;text-align:center;transition:border-color .2s;
}
.cqty:focus{border-color:var(--accent)}
.addbtn{
  background:var(--accent);border:none;border-radius:12px;
  color:#000;font-size:1.5rem;font-weight:900;width:48px;cursor:pointer;
}
.ctags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;min-height:4px}
.ctag{
  background:rgba(247,201,72,.1);border:1px solid rgba(247,201,72,.3);
  border-radius:8px;padding:5px 10px;font-size:.82rem;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.xtag{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;line-height:1}

/* SUBMIT */
.sbtn{
  width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--r);
  font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:900;padding:16px;
  cursor:pointer;transition:opacity .2s;
}
.sbtn:hover{opacity:.88}
.sbtn:disabled{opacity:.35;cursor:not-allowed}

/* DASHBOARD */
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dtitle{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.rfbtn{
  background:var(--border);border:none;border-radius:10px;
  color:var(--text);font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;
  padding:7px 14px;cursor:pointer;transition:background .15s;
}
.rfbtn:hover{background:var(--accent);color:#000}

/* TOTAL BOX */
.tbox{
  background:var(--surface);border:2px solid var(--accent);
  border-radius:var(--r);padding:16px;margin-bottom:18px;
}
.tboxt{font-size:.72rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.trow{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:6px;
}
.trow:last-child{margin-bottom:0}
.titem{font-weight:700;font-size:.95rem}
.tqty{background:var(--accent);color:#000;font-weight:900;font-size:.88rem;padding:3px 14px;border-radius:20px}

/* ORDER CARDS */
.pcount{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:10px;display:block}
.ocard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ohead{
  background:rgba(247,201,72,.06);border-bottom:1px solid var(--border);
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between;
}
.oname{font-weight:900;font-size:.95rem;color:var(--accent)}
.otime{font-size:.7rem;color:var(--muted);font-weight:600}
.opills{padding:12px 14px;display:flex;flex-wrap:wrap;gap:7px}
.pill{
  background:var(--border);border-radius:7px;padding:4px 10px;
  font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:4px;
}
.pq{color:var(--accent)}
.delbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:2px 4px;border-radius:6px}
.delbtn:hover{color:var(--red)}

.empty{text-align:center;color:var(--muted);padding:50px 20px;font-weight:700}
.eico{font-size:3rem;display:block;margin-bottom:10px}
.loader{text-align:center;padding:40px;color:var(--muted);font-weight:700}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--green);color:#000;font-weight:800;
  padding:12px 22px;border-radius:30px;font-size:.88rem;
  z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);color:#fff}
</style>
</head>
<body>

<header><div class="logo">🫡 <em>Saviours</em> Order</div></header>

<div class="tabs">
  <div class="tab on" id="t-order" onclick="go('order')">🛒 Order Do</div>
  <div class="tab" id="t-dash" onclick="go('dash')">📊 Dashboard</div>
</div>

<!-- ORDER -->
<div class="page on" id="p-order">
  <br>
  <span class="lbl">Tera naam</span>
  <input class="name-inp" id="pname" type="text" placeholder="Naam likho yahan..." maxlength="30" autocomplete="off">

  <span class="lbl">Kya lena hai?</span>
  <div class="grid" id="igrid"></div>

  <span class="lbl">Kuch aur bhi? (Optional)</span>
  <div class="crow">
    <input class="cinp" id="cname" type="text" placeholder="Item ka naam..." maxlength="40" autocomplete="off">
    <input class="cqty" id="cqty" type="number" min="1" max="99" value="1">
    <button class="addbtn" onclick="addC()">+</button>
  </div>
  <div class="ctags" id="ctags"></div>

  <button class="sbtn" id="sbtn" onclick="submit()">✅ Order Daalo</button>
</div>

<!-- DASHBOARD -->
<div class="page" id="p-dash">
  <br>
  <div class="dhead">
    <span class="dtitle">📅 Aaj ke orders</span>
    <button class="rfbtn" onclick="loadDash()">🔃 Refresh</button>
  </div>
  <div id="totalBox"></div>
  <div id="orderCards"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const { createClient } = supabase;
const db = createClient(
  'https://ytuvjhjemkzcjldiwafv.supabase.co',
  'sb_publishable_pihMOJH4lCX_JWEGIdXLXg_eFC6g1X5'
);

const ITEMS = [
  {e:'🥟',n:'Samosa'},{e:'🍬',n:'Jalebi'},{e:'🍌',n:'Banana'},
  {e:'☕',n:'Chai'},{e:'🧃',n:'Juice'},{e:'🍫',n:'Biscuit'},
  {e:'🫓',n:'Bread'},{e:'🥛',n:'Milk'},
];
const EM = Object.fromEntries(ITEMS.map(i=>[i.n,i.e]));

let Q={}, C=[];

/* ── GRID ── */
function renderGrid(){
  document.getElementById('igrid').innerHTML = ITEMS.map(it=>{
    const q=Q[it.n]||0;
    return `<div class="icard${q>0?' on':''}" >
      <span class="ie">${it.e}</span>
      <div class="in">${it.n}</div>
      <div class="qrow">
        <button class="qbtn" onclick="chq('${it.n}',-1,event)">−</button>
        <span class="qn${q===0?' z':''}">${q}</span>
        <button class="qbtn" onclick="chq('${it.n}',1,event)">+</button>
      </div>
    </div>`;
  }).join('');
}

function chq(n,d,e){
  e&&e.stopPropagation();
  const v=Math.max(0,(Q[n]||0)+d);
  v===0?delete Q[n]:Q[n]=v;
  renderGrid();
}

/* ── CUSTOM ── */
function addC(){
  const n=document.getElementById('cname').value.trim();
  const q=parseInt(document.getElementById('cqty').value)||1;
  if(!n){toast('Item ka naam likho!',1);return;}
  const i=C.findIndex(x=>x.n.toLowerCase()===n.toLowerCase());
  i>=0?C[i].q+=q:C.push({n,q});
  document.getElementById('cname').value='';
  document.getElementById('cqty').value='1';
  renderC();
}
function remC(i){C.splice(i,1);renderC();}
function renderC(){
  document.getElementById('ctags').innerHTML=C.map((c,i)=>
    `<div class="ctag">✏️ ${c.n} ×${c.q}<button class="xtag" onclick="remC(${i})">✕</button></div>`
  ).join('');
}

/* ── SUBMIT ── */
async function submit(){
  const name=document.getElementById('pname').value.trim();
  if(!name){toast('Pehle naam likho!',1);return;}

  const items={...Q};
  C.forEach(c=>{items[c.n]=(items[c.n]||0)+c.q;});
  if(!Object.keys(items).length){toast('Kuch toh select karo!',1);return;}

  const btn=document.getElementById('sbtn');
  btn.disabled=1;btn.textContent='Bhej raha hoon...';

  const {error}=await db.from('saviour_orders').insert({
    person_name:name,
    items,
    session_id:'daily'
  });

  btn.disabled=0;btn.textContent='✅ Order Daalo';
  if(error){toast('Error: '+error.message,1);return;}

  toast('🎉 Order daal diya, '+name+'!');
  Q={};C=[];
  document.getElementById('pname').value='';
  renderGrid();renderC();
}

/* ── TABS ── */
function go(tab){
  ['order','dash'].forEach(t=>{
    document.getElementById('p-'+t).classList.toggle('on',t===tab);
    document.getElementById('t-'+t).classList.toggle('on',t===tab);
  });
  if(tab==='dash')loadDash();
}

/* ── DASHBOARD ── */
async function loadDash(){
  document.getElementById('totalBox').innerHTML='';
  document.getElementById('orderCards').innerHTML='<div class="loader">⏳ Load ho raha hai...</div>';

  const now=new Date();
  const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString();
  const e=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).toISOString();

  const {data,error}=await db
    .from('saviour_orders')
    .select('*')
    .gte('created_at',s)
    .lt('created_at',e)
    .order('created_at',{ascending:true});

  if(error){toast('Error: '+error.message,1);return;}

  if(!data||!data.length){
    document.getElementById('orderCards').innerHTML=
      '<div class="empty"><span class="eico">🛒</span>Aaj abhi koi order nahi</div>';
    return;
  }

  // totals
  const T={};
  data.forEach(r=>Object.entries(r.items).forEach(([k,v])=>T[k]=(T[k]||0)+v));

  document.getElementById('totalBox').innerHTML=`
    <div class="tbox">
      <div class="tboxt">📦 Collector ke liye — Total chahiye</div>
      ${Object.entries(T).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
        `<div class="trow"><span class="titem">${EM[k]||'📦'} ${k}</span><span class="tqty">${v}</span></div>`
      ).join('')}
    </div>`;

  document.getElementById('orderCards').innerHTML=
    `<span class="pcount">👥 ${data.length} log ne order diya aaj</span>`+
    data.map(r=>{
      const t=new Date(r.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      const pills=Object.entries(r.items).map(([k,v])=>
        `<div class="pill">${EM[k]||'📦'} ${k} <span class="pq">×${v}</span></div>`
      ).join('');
      return `<div class="ocard">
        <div class="ohead">
          <span class="oname">🧑 ${r.person_name}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="otime">${t}</span>
            <button class="delbtn" onclick="del('${r.id}')">🗑️</button>
          </div>
        </div>
        <div class="opills">${pills}</div>
      </div>`;
    }).join('');
}

async function del(id){
  if(!confirm('Is order ko hatao?'))return;
  const {error}=await db.from('saviour_orders').delete().eq('id',id);
  if(error){toast('Delete nahi hua',1);return;}
  toast('Hata diya!');
  loadDash();
}

/* ── TOAST ── */
function toast(m,err=0){
  const t=document.getElementById('toast');
  t.textContent=m;t.className='toast'+(err?' err':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

/* ── INIT ── */
renderGrid();
document.getElementById('cname').addEventListener('keydown',e=>{if(e.key==='Enter')addC();});
</script>
</body>
</html>
